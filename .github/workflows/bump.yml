# Keep Formula/athena.rb on the latest athena-cli release.
#
# The tap polls instead of being pushed to: athena-cli's release workflow would
# need a cross-repository token to write here, and a scheduled read of a public
# release needs none. Run it by hand after a release with `gh workflow run bump.yml`.
name: bump

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the formula with the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo Athena-Intel/athena-cli --json tagName --jq .tagName)"
          version="${tag#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/athena.rb)"
          echo "latest=${version} formula=${current}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Render the formula from the release checksums
        if: steps.latest.outputs.version != steps.latest.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh release download "v${VERSION}" --repo Athena-Intel/athena-cli --pattern SHA256SUMS --output /tmp/SHA256SUMS --clobber
          sh scripts/render-formula.sh "${VERSION}" /tmp/SHA256SUMS > Formula/athena.rb
          ruby -c Formula/athena.rb

      - name: Commit and push
        if: steps.latest.outputs.version != steps.latest.outputs.current
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/athena.rb
          git commit -m "athena ${VERSION}"
          git push

# Tap this checkout with Homebrew's own setup action, then install the formula
# and run its test block on macOS and Linux. Homebrew refuses to install a
# formula from a bare path, and `brew` is not on PATH on the Linux runners,
# which is why the plain "brew install ./Formula/athena.rb" approach fails.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew and tap this repository
        uses: Homebrew/actions/setup-homebrew@main

      - name: Syntax
        run: ruby -c "$(brew --repository athena-intel/athena)/Formula/athena.rb"

      - name: Install
        run: |
          brew install --verbose athena-intel/athena/athena
          athena --version

      - name: Formula test block
        run: brew test athena-intel/athena/athena
